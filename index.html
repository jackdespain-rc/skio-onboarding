      <div class="callout callout-warn"><div class="callout-title">⚠️ Prep for the ROI skeptic</div>Sharp merchants push back that automated gifting eats margin (Heart &amp; Soil did, hard). Reframe: "You don't run it for everyone — you target only the high-risk cohorts and moments, like the order 1→2 and 3→4 drop-offs, so the spend goes where churn actually happens."</div>

    { id:'s3p5', title:'Steps 8–10: Segments, Analytics, Loyalty', content:`

  { id:'s4', num:4, title:'Talk Tracks & Competitive', subtitle:'New Positioning & Objection Handling', pages:[
    { id:'s4p1', title:'Competitive Overview', content:`
      <h1>Section 4 · Talk Tracks &amp; Competitive</h1>
      <p class="page-subtitle">The acquisition redrew the competitive map. Skio is off the board as a competitor — it's what we sell now — and Recharge is us, so "why did you change platforms?" is an objection to handle, not a rival to beat. This section holds the approved positioning and FUD for the brands we actually compete with now, plus objection handling.</p>
      <h2>The competitive set</h2>
      <p>Four situations, in order of how often you'll hit them: <strong>Loop</strong> (by far the most common), <strong>Stay</strong>, <strong>budget apps</strong> (Appstle, Seal, etc.), and <strong>Ordergroove</strong>. Keep it factual — the closer only works if every claim holds up.</p>
`},
    { id:'s4p2', title:'vs. Loop', content:`
      <h2>vs. Loop</h2>
      <p>Loop is the most common competitive situation.</p>
      <h3>When they're new to subscriptions:</h3>
      <ul>
        <li><strong>You get one chance to build it right.</strong> Recharge helps set the foundation for the entire subscriber experience on day one. Loop gets you live cheap, but you'll hit the ceiling faster than you think — migrating subscribers later is painful and risky. Better to start on the same platform you'll still be on at $100K MRR.</li>
        <li><strong>The team behind it.</strong> Loop doesn't have a merchant success team that comes from Shopify and Klaviyo or that are subscription experts. You want a true extension of your team to help grow the program, not just a platform to run it on. That's the difference between going live and actually scaling.</li>
        <li><strong>The data.</strong> Recharge's smart retries, cancel-flow segmentation, and journey logic are powered by data from 20,000+ brands. Loop works off a small fraction of that.</li>
        <li><strong>Feature access.</strong> New features hit Recharge 6–12 months before Loop. You're not just buying what exists today — you're buying where the platform is going.</li>
      </ul>
      <h3>When they're migrating off Loop:</h3>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"It's kind of like a MailChimp or OmniSend to Klaviyo relationship. Lower-cost tool, a little less pretty, a little less refined. That works when you're getting a business off the ground. But as you grow, you need something more polished — on the subscription experience, the admin, the analytics, and the strategic support behind it."</div>
      <h3>Proof points to hit:</h3>
      <ul>
        <li><strong>Portal UX.</strong> Loop's portal is functional but basic. Ours is built to match how a valued subscriber should feel — premium, self-serve, modular.</li>
        <li><strong>Rewards &amp; gifting.</strong> Loop uses static image uploads for rewards — when a product goes out of stock, the image breaks. Ours pulls live product images automatically.</li>
        <li><strong>Smart retries.</strong> 20,000+ brands' worth of data tells you the right time to retry a card, when to send a notification, and what sequence drives recovery.</li>
      </ul>
      <div class="talk-track"><div class="talk-track-label">🎤 The closer</div>"I'm not going to throw logos in your face and tell you that's why you should use us. All it means is that we've won the market with the brands that care most about their subscriber experience. The question is whether that matters to you."</div>
      <p><strong>Marquee Loop wins:</strong> BluePrint by Bryan Johnson, Resilia, LarineCo, Manly, BLYSS.</p>
`},
    { id:'s4p3', title:'vs. Stay & Budget Apps', content:`
      <h2>vs. Stay</h2>
      <p>Recharge has led the subscription space for 10+ years. Stay came up around the same time as Skio — the difference is what each company did with that time.</p>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"Skio built impressive tech and a reputation for scaling some of the fastest-growing CPG brands on Shopify — which is exactly why we acquired them. Stay spent that same window investing heavily in marketing and telling the world how great they were. The result is that we're consistently six to twelve months ahead of where they land on features — we ship and iterate on products before they even get there.<br><br>The bigger difference is what you get after you sign. Our merchant success team comes from Shopify, from Klaviyo, from operators who've actually built and scaled subscription programs. They're not learning your business from scratch — they've lived in this ecosystem. That's who's in your corner. Stay is a solid marketing company. We're an engineering company backed by 10 years of subscription data and a team that actually knows how to grow your program."</div>
      <h3>Traps to watch for:</h3>
      <ul>
        <li><strong>They'll lead with price.</strong> Counter with total cost of ownership — add up the tools they don't include natively that you'd have to bolt on elsewhere.</li>
        <li><strong>They'll claim feature parity.</strong> Ask them to build a journey live on the call. See how long it takes.</li>
        <li><strong>They'll lean on brand recognition.</strong> Counter with proof — Grüns, IM8, Dose Daily, Carpe chose Recharge. That's not a coincidence.</li>
      </ul>
      <div class="callout callout-success"><div class="callout-title">📊 The boomerang stat</div>20 brands migrated from Recharge to Stay.ai over the past 24 months — 12 are already back on our platform, with more in the pipeline.</div>
      <p><strong>Marquee Stay wins:</strong> Dose Daily, Graymatter, Truvani, Moonbrew, Moon Juice, Apothékary.</p>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>vs. Budget Apps (Appstle, Seal, etc.)</h2>
      <p>These come up mostly on price. Handle it directly, before they anchor on the number.</p>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"If price is the number-one concern and the budget just isn't there, I'll be straight with you — I don't recommend us. There are tools that'll get you live for less. What I'd say is that the brands doing real volume on subscriptions almost always hit a ceiling with those platforms — features you can't get, analytics you can't act on, subscriber experiences that feel cheap. When that happens, they come back. I'd rather you make the right call now than migrate twice."</div>
`},
    { id:'s4p4', title:'vs. Ordergroove & Objections', content:`
      <h2>vs. Ordergroove</h2>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"I try not to speak poorly of our competitors — if you choose to work with us, it should be because of our tech and our partnership, full stop. That said, I think it's important to share what we consistently hear from merchants who've come over from Ordergroove.<br><br>Ordergroove wasn't built for Shopify. It was originally built for Salesforce Commerce Cloud, and that foundation doesn't align naturally with how Shopify works. We were built on top of Shopify's Subscriptions API from day one, which means our data model sits right next to Shopify's — faster to ship, fewer workarounds, no translation layer.<br><br>Ordergroove's approach is to say yes to everything — even if that means their dev team has to build a custom, one-off feature to meet your requirements. That sounds great at first, but over time it creates the exact kind of tech debt you were trying to avoid when you chose Shopify. And when you want changes down the road, we hear it often requires a change order — which means slow, and sometimes costly, innovation. We invest directly into the platform, and every merchant gets the benefit automatically — no change orders, no waiting in line.<br><br>The last thing worth knowing: Ordergroove is known for locking merchants into long contract terms at renewal. We don't do that."</div>
      <ul>
        <li><strong>Shopify-native, not SFCC.</strong> Recharge and Skio were both built for Shopify — it's the only platform we work with. Ordergroove was originally built for Salesforce Commerce Cloud, so their Shopify solutions are often incomplete, or filled in with custom code built for your store.</li>
        <li><strong>Dev-team lock-in.</strong> Their "edge" is matching the exact functionality you need — which really means their dev team builds one-off features for you. Every change after that requires their dev team: change orders, new fees, slow turnaround.</li>
        <li><strong>Productized + API.</strong> We productize new feature requests so every merchant gets them turnkey. If the platform can't do 100% of what you need, our robust API covers the gap — but our team stays out of it — which means faster implementations, better R&amp;D, and less tech debt as you grow.</li>
        <li><strong>Poor contracts.</strong> Ordergroove relies on 3-year terms to lock you in and then forget about you. We talk to merchants all the time who feel stuck with a vendor that won't respond to them.</li>
      </ul>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>Post-acquisition objections</h2>
      <h3>"Why did you change platforms? What happened to Recharge?"</h3>
      <p>Lean on the "upgrade, not a switch / where our R&amp;D is going" framing from the Narrative. Skio is our tech now — same company, stronger platform, more investment going forward.</p>
      <h3>"Are we being forced off Recharge?"</h3>
      <p>No one is being forced off anything. Existing Recharge merchants continue on Recharge. For new business, we recommend Skio because it's where our R&amp;D is going and best fits high-growth brands.</p>
      <h3>"How does migration work / how risky is it?"</h3>
      <p>Don't lead with migration — "we don't win on migrations; we win on the product." Reassure: Skio's launch team handles the heavy lifting, widget matched to parity. Example: 5-day Lolavie migration when they were about to lose their subscribers.</p>
      <div class="callout callout-dark"><div class="callout-title">Practice this live</div>These competitive and objection talk tracks are part of the capstone in Section 5 — reps handle at least two live objections to get certified.</div>
`},

  ]},

// ═══════════════════════════════════════════════════
//  STATE + STORAGE
// ═══════════════════════════════════════════════════

const state = {
  view: 'login', user: null, progress: {},
  reader: { sectionId: null, pageIndex: 0 },
  dashTab: 'course',   // 'course' | 'scores'
  adminAuthed: false, adminView: 'list', adminRepEmail: null,
  adminReps: null,     // null = not yet fetched; [] = fetched (may be empty)
  adminRepData: null,  // { progress, grades } for the rep currently being graded
  repGrades: null,     // the logged-in rep's own grades (fetched from server)
};
const ADMIN_CODE = 'skio2024';

function saveUser() { if (state.user) localStorage.setItem('skio_user', JSON.stringify(state.user)); }
function loadUser() { try { state.user = JSON.parse(localStorage.getItem('skio_user')) || null; } catch(e) {} }
// ── Progress: write to localStorage immediately, fire-and-forget to server ───
function saveProgress() {
  if (!state.user) return;
  localStorage.setItem('skio_prog_' + state.user.email, JSON.stringify(state.progress));
  fetch('/api/progress/' + encodeURIComponent(state.user.email), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ progress: state.progress, name: state.user.name }),
  }).catch(() => {}); // silent — localStorage is the fallback
}
function loadProgress() {
  if (!state.user) return;
  try { state.progress = JSON.parse(localStorage.getItem('skio_prog_' + state.user.email)) || {}; } catch(e) { state.progress = {}; }
}
// On login / page load, pull latest from server and refresh state
async function syncProgressFromServer(email) {
  try {
    const r = await fetch('/api/progress/' + encodeURIComponent(email));
    const { progress } = await r.json();
    if (progress) {
      state.progress = progress;
      localStorage.setItem('skio_prog_' + email, JSON.stringify(progress));
      initProgress();
      render();
    }
  } catch(e) { /* stay on localStorage */ }
}
function initProgress() {
  SECTIONS.forEach(s => {
    if (!state.progress[s.id]) {
      state.progress[s.id] = { readPages: [], homework: {}, submitted: false };
    } else {
      if (!state.progress[s.id].homework) state.progress[s.id].homework = {};
    }
  });
  saveProgress();
}
// ── Grades: stored per-rep on the server; cached in state for the admin UI ──
function saveGrades(grades) {
  const email = state.adminRepEmail;
  if (!email) return;
  // Update local state cache
  if (state.adminRepData) state.adminRepData.grades = grades[email] || {};
  // Persist to server
  fetch('/api/grades/' + encodeURIComponent(email), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ grades: grades[email] || {} }),
  }).catch(() => {});
}
function loadGrades() {
  // Returns a { [email]: grades } object compatible with existing bindRepGradeView logic
  if (state.adminRepData && state.adminRepEmail) {
    return { [state.adminRepEmail]: state.adminRepData.grades || {} };
  }
  return {};
}
// Fetch the logged-in rep's own grades so Section 5 can show the Gong link
async function syncRepGradesFromServer(email) {
  try {
    const r = await fetch('/api/grades/' + encodeURIComponent(email));
    const { grades } = await r.json();
    state.repGrades = grades || {};
    render(); // re-render so Section 5 picks up the capstone URL if present
  } catch(e) {}
}
// ── Admin data fetchers ──────────────────────────────────────────────────────
async function fetchAdminReps() {
  try {
    const r = await fetch('/api/reps');
    const { reps } = await r.json();
    state.adminReps = reps || [];
  } catch(e) {
    state.adminReps = []; // show empty rather than spin forever
  }
  render();
}
async function fetchRepData(email) {
  try {
    const [pRes, gRes] = await Promise.all([
      fetch('/api/progress/' + encodeURIComponent(email)),
      fetch('/api/grades/'   + encodeURIComponent(email)),
    ]);
    const { progress } = await pRes.json();
    const { grades }   = await gRes.json();
    state.adminRepData = { progress: progress || {}, grades: grades || {} };
  } catch(e) {
    state.adminRepData = { progress: {}, grades: {} };
  }
  render();
}

//  HELPERS
// ═══════════════════════════════════════════════════

function isSectionUnlocked(sectionId) {
  const idx = SECTIONS.findIndex(s => s.id === sectionId);
  if (idx === 0) return true;
  const prev = SECTIONS[idx - 1];
  return state.progress[prev.id] && state.progress[prev.id].submitted === true;
}

function getSectionProgress(sectionId) {
  const section = SECTIONS.find(s => s.id === sectionId);
  const prog = state.progress[sectionId] || { readPages: [], submitted: false };
  const contentPages = section.pages.filter(p => !p.type);
  const read = (prog.readPages || []).length;
  const total = contentPages.length;
  return { read, total, pct: total ? Math.round((read / total) * 100) : 0, submitted: !!prog.submitted };
}

function getTotalProgress() {
  let read = 0, total = 0;
  SECTIONS.forEach(s => { const p = getSectionProgress(s.id); read += p.read; total += p.total; });
  return { read, total, pct: total ? Math.round((read / total) * 100) : 0 };
}

function markPageRead(sectionId, pageId) {
  if (!state.progress[sectionId]) state.progress[sectionId] = { readPages: [], homework: {}, submitted: false };
  const rp = state.progress[sectionId].readPages;
  if (!rp.includes(pageId)) { rp.push(pageId); saveProgress(); }
}

function isHomeworkComplete(sectionId) {
  const hw = HOMEWORK[sectionId];
  if (!hw) return true;
  const answers = (state.progress[sectionId] || {}).homework || {};
  for (const group of hw.groups) {
    for (const item of group.items) {
      if (item.type === 'link_note') {
        if (!answers[item.id + '_url'] || !answers[item.id + '_note']) return false;
      } else {
        if (!answers[item.id] || !String(answers[item.id]).trim()) return false;
      }
    }
  }
  return true;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function render() {
  const app = document.getElementById('app');
  if (state.view === 'login') { app.innerHTML = renderLogin(); bindLogin(); return; }
  app.innerHTML = `<div class="shell">${renderSidebar()}<div class="main"><div id="main-content"></div></div></div>`;
  const mc = document.getElementById('main-content');
  if (state.view === 'home') { mc.innerHTML = renderDashboard(); bindDashboard(); }
  else if (state.view === 'reader') { mc.innerHTML = renderReader(); bindReader(); }
  else if (state.view === 'admin') {
    if (!state.adminAuthed) { mc.innerHTML = renderAdminGate(); }
    else if (state.adminView === 'rep') { mc.innerHTML = renderRepGradeView(); bindRepGradeView(); }
    else { mc.innerHTML = renderAdminDashboard(); }
    bindAdmin();
  }
  bindSidebar();
}

function renderLogin() {
  return `<div class="login-wrap"><div class="login-card fade-in">

function bindLogin() {
  const name = document.getElementById('inp-name');
  const email = document.getElementById('inp-email');
  const btn = document.getElementById('btn-login');
  const check = () => { btn.disabled = !(name.value.trim().length > 1 && email.value.includes('@')); };
  name.addEventListener('input', check);
  email.addEventListener('input', check);
  name.addEventListener('keydown', e => { if (e.key === 'Enter') email.focus(); });
  email.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) doLogin(); });
  btn.addEventListener('click', doLogin);
  function doLogin() {
    state.user = { name: name.value.trim(), email: email.value.trim().toLowerCase() };
    saveUser(); loadProgress(); initProgress(); state.view = 'home'; render();

    const numContent = p.submitted ? '✓' : !unlocked ? '🔒' : s.num;
    return `<div class="ssi ${active ? 'active' : ''} ${!unlocked ? 'locked' : ''}" data-nav="${s.id}">

function bindSidebar() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const nav = el.dataset.nav;
      if (nav === 'home') { state.view = 'home'; render(); return; }
      const section = SECTIONS.find(s => s.id === nav);

      if (!isSectionUnlocked(section.id)) { toast('Complete Section ' + (section.num - 1) + ' first to unlock this section.'); return; }
      openReader(nav, 0);
    });

}

function renderScoresTab() {
  const grades = state.repGrades || {};
  const submittedSections = SECTIONS.filter(s => state.progress[s.id]?.submitted);

  if (submittedSections.length === 0) {
    return `<div class="scores-empty">
      <div style="font-size:32px;margin-bottom:12px;">📋</div>
      <div style="font-weight:600;margin-bottom:6px;">Nothing to show yet</div>
      <div>Complete and submit a section to see your scores and manager feedback here.</div>
    </div>`;
  }

  // Summary stats
  let totalScore = 0, totalGraded = 0, sectionsApproved = 0;
  submittedSections.forEach(s => {
    const sg = grades[s.id] || {};
    if (sg.approved) sectionsApproved++;
    Object.entries(sg).forEach(([k, v]) => {
      if (k !== 'approved' && typeof v === 'object' && v && v.score) {
        totalScore += v.score; totalGraded++;
      }
    });
  });
  const avgScore = totalGraded ? (totalScore / totalGraded).toFixed(1) : null;

  // Capstone block
  const gongUrl = grades.capstone && grades.capstone.gongUrl;
  const capstoneBlock = gongUrl ? `
    <div class="scores-section" style="border-color:var(--accent);">
      <div class="scores-section-header">
        <h3>🎥 Capstone Recording</h3>
        <span class="pill pill-green">Linked</span>
      </div>
      <div class="scores-item">
        <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Your manager has linked your mock demo recording below.</div>
        <a href="${gongUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;">▶ Watch in Gong</a>
      </div>
    </div>` : '';

  // Per-section blocks
  const sectionBlocks = submittedSections.map(section => {
    const hw = HOMEWORK[section.id];
    if (!hw) return '';
    const secGrades = grades[section.id] || {};
    const answers = state.progress[section.id]?.homework || {};
    const approved = secGrades.approved;

    let itemsHtml = '';
    hw.groups.forEach(group => {
      group.items.forEach(item => {
        const answer = item.type === 'link_note'
          ? [answers[item.id + '_url'], answers[item.id + '_note']].filter(Boolean).join('\n')
          : (answers[item.id] || '');
        const ig = secGrades[item.id];
        if (!answer && !ig) return; // skip completely blank items
        const stars = ig && ig.score
          ? '★'.repeat(ig.score) + '☆'.repeat(5 - ig.score)
          : null;

        itemsHtml += `<div class="scores-item">
          <div class="scores-item-label">${item.label}</div>
          <div class="scores-item-prompt">${item.prompt}</div>
          ${answer ? `<div class="scores-item-answer">${answer}</div>` : ''}
          ${stars ? `<div class="scores-feedback">
            <span class="scores-stars">${stars}</span>
            ${ig.feedback ? `<span class="scores-note">"${ig.feedback}"</span>` : ''}
          </div>` : (secGrades.approved === undefined && !stars ? `<div style="font-size:12px;color:var(--muted);padding:4px 0;">⏳ Awaiting manager review</div>` : '')}
        </div>`;
      });
    });

    return `<div class="scores-section">
      <div class="scores-section-header">
        <h3>Section ${section.num}: ${section.title}</h3>
        ${approved ? '<span class="pill pill-green">✓ Approved</span>' : '<span class="pill pill-gray">Pending</span>'}
      </div>
      ${itemsHtml || `<div style="padding:18px 22px;font-size:13px;color:var(--muted);">⏳ Awaiting manager review</div>`}
    </div>`;
  }).join('');

  return `
    <div class="scores-summary">
      <div class="scores-stat">
        <div class="scores-stat-num">${submittedSections.length} / ${SECTIONS.length}</div>
        <div class="scores-stat-label">Sections Submitted</div>
      </div>
      <div style="width:1px;height:40px;background:var(--border);"></div>
      <div class="scores-stat">
        <div class="scores-stat-num">${sectionsApproved}</div>
        <div class="scores-stat-label">Sections Approved</div>
      </div>
      <div style="width:1px;height:40px;background:var(--border);"></div>
      <div class="scores-stat">
        <div class="scores-stat-num">${avgScore ? avgScore + ' / 5' : '—'}</div>
        <div class="scores-stat-label">Avg Score</div>
      </div>
      ${gongUrl ? `<div style="width:1px;height:40px;background:var(--border);"></div>
      <div class="scores-stat">
        <div class="scores-stat-num" style="font-size:20px;">🎥</div>
        <div class="scores-stat-label">Recording Linked</div>
      </div>` : ''}
    </div>
    ${capstoneBlock}
    ${sectionBlocks}`;
}

function renderDashboard() {
  const total = getTotalProgress();
  const C = 2 * Math.PI * 30;
  const dash = C - (total.pct / 100) * C;
  const submittedCount = SECTIONS.filter(s => getSectionProgress(s.id).submitted).length;

  const tabBar = `<div class="dash-tabs">
    <button class="dash-tab ${state.dashTab === 'course' ? 'active' : ''}" data-tab="course">Course</button>
    <button class="dash-tab ${state.dashTab === 'scores' ? 'active' : ''}" data-tab="scores">My Scores</button>
  </div>`;

  const progressRing = `<div class="overall-progress">
    <div class="op-ring">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#E4E4E7" stroke-width="6"/>
        <circle cx="36" cy="36" r="30" fill="none" stroke="#0D9488" stroke-width="6"
          stroke-dasharray="${C}" stroke-dashoffset="${dash}" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:50% 50%"/>
      </svg>
      <div class="op-ring-text">${total.pct}%</div>
    </div>
    <div class="op-info">
      <h2>Welcome back, ${state.user ? state.user.name.split(' ')[0] : 'there'}! 👋</h2>
      <p>${total.read} of ${total.total} pages read &nbsp;·&nbsp; ${submittedCount} of 5 sections submitted</p>
    </div>
  </div>`;

  const courseTab = SECTIONS.map(s => {
    const p = getSectionProgress(s.id);
    const unlocked = isSectionUnlocked(s.id);
    const statusClass = !unlocked ? 'locked' : p.submitted ? 'complete' : p.pct > 0 ? 'in-progress' : 'not-started';
    const statusLabel = !unlocked ? '🔒 Locked' : p.submitted ? '✓ Complete' : p.pct > 0 ? 'In Progress' : 'Not Started';
    const contentPageCount = s.pages.filter(pg => !pg.type).length;
    return `<div class="section-card ${p.submitted ? 'complete' : ''} ${!unlocked ? 'locked' : ''}" data-open="${s.id}">
      <div class="sc-num">Section ${s.num} ${!unlocked ? '&nbsp;🔒' : ''}</div>
      <div class="sc-title">${s.title}</div>
      <div class="sc-sub">${s.subtitle}</div>
      <div class="sc-meta">
        <div class="sc-pages">${contentPageCount} pages</div>
        <div class="sc-status ${statusClass}">${statusLabel}</div>
      </div>
      <div class="sc-progress-bar"><div class="sc-progress-fill" style="width:${unlocked ? p.pct : 0}%"></div></div>
    </div>`;
  }).join('');

  const body = state.dashTab === 'scores'
    ? renderScoresTab()
    : `<div class="section-cards">${courseTab}</div>`;

  const beforeYouStart = state.dashTab === 'course' ? `
    <div class="callout callout-warn" style="margin-bottom:24px;">
      <div class="callout-title">📋 Before You Start</div>
      Get access to <strong>Avoma</strong> from <strong>Zev</strong> before you begin — there is a lot of linked call content throughout this course and you will not be able to view it without access. Reach out to Zev directly and ask to be added to the Avoma workspace before getting started.
    </div>` : '';

  return `<div class="dashboard-wrap"><div class="dashboard-inner">
    ${progressRing}
    ${beforeYouStart}
    ${tabBar}
    ${body}
  </div></div>`;
}

function bindDashboard() {
  document.querySelectorAll('.dash-tab').forEach(btn => {
    btn.addEventListener('click', () => { state.dashTab = btn.dataset.tab; render(); });
  });
  document.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => {
      const sId = el.dataset.open;
      if (!isSectionUnlocked(sId)) { toast('Complete the previous section first to unlock this one.'); return; }
      openReader(sId, 0);
    });
  });
}

function openReader(sectionId, pageIndex) {
  state.view = 'reader';
  state.reader.sectionId = sectionId;
  state.reader.pageIndex = pageIndex;
  const section = SECTIONS.find(s => s.id === sectionId);
  const page = section.pages[pageIndex];
  if (!page.type) markPageRead(sectionId, page.id);
  render();
}

function renderReader() {
  const section = SECTIONS.find(s => s.id === state.reader.sectionId);
  const pageIdx = state.reader.pageIndex;
  const page = section.pages[pageIdx];
  const p = getSectionProgress(section.id);
  const isHwPage = page.type === 'homework';
  const isQuizPage = page.type === 'quiz';
  const hwComplete = isHwPage && isHomeworkComplete(section.id);
  const alreadySubmitted = state.progress[section.id]?.submitted;

  const topbar = `<div class="topbar">
    <div class="topbar-breadcrumb">Section ${section.num} &nbsp;·&nbsp; <strong>${page.title}</strong></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-progress">
      <div class="topbar-progress-label">Progress</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${p.pct}%"></div></div>
      <div class="topbar-page-count">${pageIdx + 1} / ${section.pages.length}</div>
    </div>
  </div>`;

  // If the rep has a Gong recording uploaded, append it to the Capstone Rubric page
  const gongBlock = (() => {
    if (page.id !== 's5p2') return '';
    const url = state.repGrades && state.repGrades.capstone && state.repGrades.capstone.gongUrl;
    if (!url) return '';
    return `<div class="callout callout-accent" style="margin-top:24px;">
      <div class="callout-title">🎥 Your Mock Demo Recording</div>
      <p style="margin-bottom:10px;">Your manager has linked your Gong recording below. Review it to see where you nailed it and what to sharpen before your next call.</p>
      <a href="${url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;">▶ Watch your mock demo in Gong</a>
    </div>`;
  })();

  const content = isHwPage
    ? `<div class="reader-wrap"><div class="reader-inner fade-in">${renderHomeworkPage(section.id)}</div></div>`
    : isQuizPage
    ? `<div class="reader-wrap"><div class="reader-inner fade-in">${renderQuizPage(section.id, page.quizGroupIndices)}</div></div>`
    : `<div class="reader-wrap"><div class="reader-inner fade-in">${page.content}${gongBlock}</div></div>`;

  let navRight = '';
  if (isHwPage) {
    if (alreadySubmitted) {
      navRight = `<button class="btn-nav btn-nav-primary" id="btn-finish" disabled>✓ Submitted</button>`;
    } else {
      navRight = `<button class="btn-nav btn-nav-primary" id="btn-submit-section" ${hwComplete ? '' : 'disabled'}>Submit Section ✓</button>`;
    }
  } else if (isQuizPage) {
    navRight = `<button class="btn-nav btn-nav-primary" id="btn-next">Save & Continue →</button>`;
  } else {
    navRight = `<button class="btn-nav btn-nav-primary" id="btn-next">Next →</button>`;
  }

  const nav = `<div class="reader-nav">
    <button class="btn-nav" id="btn-prev" ${pageIdx === 0 ? 'disabled' : ''}>← Previous</button>
    <div class="nav-center">${section.title} · Page ${pageIdx + 1} of ${section.pages.length}</div>
    ${navRight}
  </div>`;

  return topbar + content + nav;
}

function bindReader() {
  const section = SECTIONS.find(s => s.id === state.reader.sectionId);
  const pageIdx = state.reader.pageIndex;
  const page = section.pages[pageIdx];
  const isHwPage = page.type === 'homework';
  const isQuizPage = page.type === 'quiz';

  document.getElementById('btn-prev')?.addEventListener('click', () => {
    openReader(section.id, pageIdx - 1);
    document.querySelector('.reader-wrap')?.scrollTo(0, 0);
  });
  document.getElementById('btn-next')?.addEventListener('click', () => {
    const nextPage = section.pages[pageIdx + 1];
    if (!nextPage.type) markPageRead(section.id, nextPage.id);
    state.reader.pageIndex = pageIdx + 1;
    render();
    document.querySelector('.reader-wrap')?.scrollTo(0, 0);
  });
  document.getElementById('btn-submit-section')?.addEventListener('click', () => {
    if (!isHomeworkComplete(section.id)) return;
    state.progress[section.id].submitted = true;
    state.progress[section.id].submittedAt = new Date().toISOString();
    saveProgress();
    toast('Section ' + section.num + ' submitted! ✓');
    state.view = 'home'; render();
  });

  if (isHwPage || isQuizPage) bindHomeworkForm(section.id);
}

function renderQuizPage(sectionId, groupIndices) {
  const hw = HOMEWORK[sectionId];
  if (!hw) return '<p>No quiz for this section.</p>';
  const answers = (state.progress[sectionId] || {}).homework || {};

  let html = `<div class="hw-wrap">
    <div class="hw-header">
      <h1>✅ Check Yourself</h1>
      <p>Answer in your own words — open-book is fine. Your answers save as you type. Hit "Save & Continue" when you're ready to move on.</p>
    </div>`;

  for (const idx of groupIndices) {
    const group = hw.groups[idx];
    if (!group) continue;
    html += `<div class="hw-group"><div class="hw-group-title">${group.title}</div>`;
    for (const item of group.items) {
      const val = answers[item.id] || '';
      html += `<div class="hw-item">
        <div class="hw-item-label">${item.label}</div>
        <div class="hw-item-prompt">${item.prompt}</div>
        <textarea class="hw-textarea hw-field" data-id="${item.id}" placeholder="Your answer...">${val}</textarea>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// ═══════════════════════════════════════════════════
//  HOMEWORK PAGE
// ═══════════════════════════════════════════════════

function renderHomeworkPage(sectionId) {
  const hw = HOMEWORK[sectionId];
  if (!hw) return '<p>No homework for this section.</p>';
  const prog = state.progress[sectionId] || {};
  const answers = prog.homework || {};
  const submitted = prog.submitted;
  const section = SECTIONS.find(s => s.id === sectionId);
  const hasInlineQuizzes = section && section.pages.some(p => p.type === 'quiz');

  // Sections with inline quiz checkpoints get a summary+submit page instead of re-rendering all questions
  if (hasInlineQuizzes) {
    const allItems = hw.groups.flatMap(g => g.items);
    const answeredCount = allItems.filter(item => answers[item.id] && String(answers[item.id]).trim()).length;
    const totalCount = allItems.length;
    const complete = answeredCount === totalCount;
    return `<div class="hw-wrap">
      <div class="hw-header">
        <h1>📋 ${hw.title}</h1>
        <p>${hw.intro}</p>
        ${submitted ? '<div class="hw-submitted-badge">✓ Submitted — awaiting manager review</div>' : ''}
      </div>
      <div style="background:white;border:1.5px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="font-size:15px;font-weight:700;">Quiz Completion</div>
          <div style="font-size:14px;color:var(--muted);">${answeredCount} / ${totalCount} answered</div>
        </div>
        <div style="height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px;">
          <div style="width:${Math.round(answeredCount/totalCount*100)}%;height:100%;background:${complete?'var(--success)':'var(--accent)'};border-radius:99px;transition:width 0.4s;"></div>
        </div>
        ${hw.groups.map(g => {
          const done = g.items.every(item => answers[item.id] && String(answers[item.id]).trim());
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <span style="font-size:14px;line-height:1;">${done ? '✅' : '⬜'}</span>
            <span style="font-size:13px;color:${done ? 'var(--text)' : 'var(--muted)'};">${g.title} <span style="color:var(--muted);font-size:11px;">(${g.items.length} q)</span></span>
          </div>`;
        }).join('')}
      </div>
      ${!complete && !submitted ? `<div class="callout callout-warn"><div class="callout-title">Not quite done</div>Go back and finish any unanswered questions — then the Submit button will unlock.</div>` : ''}
    </div>`;
  }

  let html = `<div class="hw-wrap">
    <div class="hw-header">
      <h1>📋 ${hw.title}</h1>
      <p>${hw.intro}</p>
      ${submitted ? (() => {
        const secGrades = (state.repGrades || {})[sectionId] || {};
        const isApproved = secGrades.approved;
        const hasFeedback = Object.values(secGrades).some(v => v && typeof v === 'object' && v.score);
        if (isApproved) return '<div class="hw-submitted-badge" style="background:var(--success-bg);color:var(--success);border-color:var(--success);">✓ Approved by your manager</div>';
        if (hasFeedback) return '<div class="hw-submitted-badge" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;">💬 Manager feedback below — review and discuss</div>';
        return '<div class="hw-submitted-badge">✓ Submitted — awaiting manager review</div>';
      })() : ''}
    </div>`;

  for (const group of hw.groups) {
    html += `<div class="hw-group"><div class="hw-group-title">${group.title}</div>`;
    for (const item of group.items) {
      const val = answers[item.id] || '';
      const valUrl = answers[item.id + '_url'] || '';
      const valNote = answers[item.id + '_note'] || '';
      // Use rep's own grades (fetched from server on login) so feedback is visible to reps
      const sectionGrades = (state.repGrades || {})[sectionId] || {};
      const itemGrade = sectionGrades[item.id];

      html += `<div class="hw-item">
        <div class="hw-item-label">${item.label}</div>
        <div class="hw-item-prompt">${item.prompt}</div>`;

      if (submitted) {
        if (item.type === 'link_note') {
          html += `<div class="hw-answer-readonly">${valUrl || '(no URL submitted)'}</div>`;
          html += `<div class="hw-answer-readonly" style="margin-top:6px;">${valNote || '(no note submitted)'}</div>`;
        } else {
          html += `<div class="hw-answer-readonly">${val || '(no answer submitted)'}</div>`;
        }
        if (itemGrade) {
          const stars = '★'.repeat(itemGrade.score) + '☆'.repeat(5 - itemGrade.score);
          html += `<div class="hw-feedback-block"><strong>Manager feedback</strong>${stars} &nbsp;${itemGrade.feedback || ''}</div>`;
        }
      } else {
        if (item.type === 'loom') {
          html += `<input type="url" class="hw-input hw-field" data-id="${item.id}" placeholder="https://www.loom.com/share/..." value="${val}">`;
        } else if (item.type === 'quiz') {
          html += `<textarea class="hw-textarea hw-field" data-id="${item.id}" placeholder="Your answer...">${val}</textarea>`;
        } else if (item.type === 'link_note') {
          html += `<div class="hw-link-note">
            <input type="url" class="hw-input hw-field" data-id="${item.id}_url" placeholder="https://..." value="${valUrl}">
            <textarea class="hw-textarea hw-field" data-id="${item.id}_note" placeholder="1–2 sentence note on why you chose it and how it highlights this feature..." style="min-height:60px;">${valNote}</textarea>
          </div>`;
        } else if (item.type === 'textarea') {
          html += `<textarea class="hw-textarea hw-field" data-id="${item.id}" placeholder="Your notes..." style="min-height:100px;">${val}</textarea>`;
        }
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function bindHomeworkForm(sectionId) {
  document.querySelectorAll('.hw-field').forEach(field => {
    field.addEventListener('input', () => {
      if (!state.progress[sectionId]) state.progress[sectionId] = { readPages: [], homework: {}, submitted: false };
      if (!state.progress[sectionId].homework) state.progress[sectionId].homework = {};
      state.progress[sectionId].homework[field.dataset.id] = field.value;
      saveProgress();
      const submitBtn = document.getElementById('btn-submit-section');
      if (submitBtn) submitBtn.disabled = !isHomeworkComplete(sectionId);
    });
  });
  // Set initial button state
  const submitBtn = document.getElementById('btn-submit-section');
  if (submitBtn) submitBtn.disabled = !isHomeworkComplete(sectionId);
}

function getRepName(email) {
  // Try server data first, then current user, then derive from email
  if (state.adminReps) {
    const rep = state.adminReps.find(r => r.email === email);
    if (rep && rep.name) return rep.name;
  }
  try {
    const user = JSON.parse(localStorage.getItem('skio_user'));
    if (user && user.email === email) return user.name;
  } catch(e) {}
  return email.split('@')[0];
}

// ── CSV export helper ────────────────────────────────────────────────────────
function exportRepsCsv() {
  if (!state.adminReps || state.adminReps.length === 0) { toast('No rep data to export.'); return; }

  // Build header row
  const sectionHeaders = SECTIONS.flatMap(s => [
    'S' + s.num + ' Submitted',
    'S' + s.num + ' Approved',
    'S' + s.num + ' Avg Score'
  ]);
  const headers = ['Name', 'Email', 'Last Active', ...sectionHeaders, 'Capstone Recorded', 'Gong URL'];

  const rows = state.adminReps.map(r => {
    const prog = r.progress || {};
    const grades = r.grades || {};
    const lastActive = r.lastActive ? new Date(r.lastActive._seconds ? r.lastActive._seconds * 1000 : r.lastActive).toLocaleDateString() : '';

    const sectionCells = SECTIONS.flatMap(s => {
      const submitted = prog[s.id]?.submitted ? 'Yes' : 'No';
      const secGrades = grades[s.id] || {};
      const approved = secGrades.approved ? 'Yes' : 'No';
      // Average star score across all graded items (skip ungraded)
      const scores = Object.entries(secGrades)
        .filter(([k, v]) => k !== 'approved' && typeof v === 'object' && v.score)
        .map(([, v]) => v.score);
      const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '';
      return [submitted, approved, avg];
    });

    const capstoneSaved = grades.capstone && grades.capstone.gongUrl;
    return [
      r.name || r.email,
      r.email,
      lastActive,
      ...sectionCells,
      capstoneSaved ? 'Yes' : 'No',
      capstoneSaved ? grades.capstone.gongUrl : ''
    ];
  });

  const escape = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = [headers, ...rows].map(row => row.map(escape).join(',')).join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'skio-scorecard-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

function bindAdmin() {
  // Gate
  document.getElementById('btn-admin-enter')?.addEventListener('click', () => {
    const code = document.getElementById('admin-code-inp')?.value;
    if (code === ADMIN_CODE) { state.adminAuthed = true; state.adminView = 'list'; state.adminReps = null; render(); }
    else { document.getElementById('admin-error').style.display = 'block'; }
  });
  document.getElementById('admin-code-inp')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-admin-enter')?.click();
  });
  // Back buttons
  document.getElementById('btn-back-home')?.addEventListener('click', () => { state.view = 'home'; render(); });
  document.getElementById('btn-back-list')?.addEventListener('click', () => { state.adminView = 'list'; render(); });
  // Exports
  document.getElementById('btn-export-csv')?.addEventListener('click', exportRepsCsv);
  document.getElementById('btn-export-pdf')?.addEventListener('click', () => window.print());
  // Rep rows — clear cached rep data so fetchRepData fires fresh
  document.querySelectorAll('.rep-row[data-rep]').forEach(el => {
    el.addEventListener('click', () => {
      state.adminRepEmail = el.dataset.rep;
      state.adminRepData = null;
      state.adminView = 'rep'; render();
    });
  });
}

function bindRepGradeView() {
  const email = state.adminRepEmail;
  const grades = loadGrades();
  if (!grades[email]) grades[email] = {};

  // Stars
  document.querySelectorAll('.star-row').forEach(row => {
    row.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const sid = row.dataset.sid, iid = row.dataset.iid, val = parseInt(star.dataset.val);
        if (!grades[email][sid]) grades[email][sid] = {};
        if (!grades[email][sid][iid]) grades[email][sid][iid] = {};
        grades[email][sid][iid].score = val;
        saveGrades(grades);
        row.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('on', i < val));
      });
    });
  });

  // Feedback notes
  document.querySelectorAll('.grade-note').forEach(inp => {
    inp.addEventListener('change', () => {
      const sid = inp.dataset.sid, iid = inp.dataset.iid;
      if (!grades[email][sid]) grades[email][sid] = {};
      if (!grades[email][sid][iid]) grades[email][sid][iid] = {};
      grades[email][sid][iid].feedback = inp.value;
      saveGrades(grades);
    });
  });

  // Capstone Gong URL
  document.getElementById('btn-save-capstone')?.addEventListener('click', () => {
    const url = document.getElementById('capstone-gong-url')?.value.trim();
    if (!grades[email].capstone) grades[email].capstone = {};
    grades[email].capstone.gongUrl = url;
    saveGrades(grades);
    toast('Recording saved ✓');
    render(); // re-renders the card to show "currently saved" state
  });

  // Approve buttons
  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.approve;
      if (!grades[email][sid]) grades[email][sid] = {};
      grades[email][sid].approved = !grades[email][sid].approved;
      saveGrades(grades);
      render();
    });
  });
}

// ── Lightbox ─────────────────────────────────────────────────────────────────
(function() {
  // Inject overlay DOM once
  const overlay = document.createElement('div');
  overlay.id = 'lightbox-overlay';
  overlay.innerHTML = '<button id="lightbox-close" aria-label="Close">✕</button><img id="lightbox-img" src="" alt="">';
  document.body.appendChild(overlay);

  const lbImg = document.getElementById('lightbox-img');

  function openLightbox(src, alt) {
    lbImg.src = src; lbImg.alt = alt || '';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
  }

  // Close on overlay background or ✕ button
  overlay.addEventListener('click', e => { if (e.target !== lbImg) closeLightbox(); });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // Trigger on any img click — works even after re-renders
  document.addEventListener('click', e => {
    if (e.target.tagName === 'IMG' && e.target.src) {
      openLightbox(e.target.src, e.target.alt);
    }
  });
})();
