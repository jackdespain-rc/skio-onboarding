<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Sell Skio — Rep Enablement</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #EDE9DF;
  --surface: #F7F3EB;
  --sidebar: #1A1814;
  --sidebar-hover: #2C2820;
  --accent: #1847F0;
  --accent-light: #DDE5FF;
  --text: #1A1814;
  --muted: #7A7468;
  --border: #D5CEC4;
  --white: #FAF7F2;
  --success: #4E6320;
  --success-bg: #E8EED4;
  --warn: #A85D0A;
  --warn-bg: #FBF0E2;
  --locked: #9A9288;
  --reader-max: 720px;
  --serif: 'Fraunces', Georgia, serif;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
#app { height: 100vh; display: flex; flex-direction: column; }

/* Login */
.login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--sidebar); }
.login-card { background: var(--white); border-radius: 20px; padding: 52px; width: 100%; max-width: 440px; border: 1px solid var(--border); }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.login-logo-badge { background: var(--accent); color: white; font-family: var(--serif); font-weight: 700; font-size: 18px; padding: 6px 16px; border-radius: 99px; letter-spacing: -0.01em; }
.login-logo-sub { font-size: 13px; color: var(--muted); font-weight: 500; }
.login-card h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; letter-spacing: -0.02em; }
.login-card p { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; color: var(--muted); }
.form-group input { width: 100%; padding: 11px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; background: var(--bg); color: var(--text); }
.form-group input:focus { border-color: var(--accent); background: var(--white); }
.btn-primary { width: 100%; padding: 13px; background: var(--accent); color: white; border: none; border-radius: 99px; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: background 0.15s, opacity 0.15s; }
.btn-primary:hover { background: #0F35CC; }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.login-note { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }

/* Shell */
.shell { flex: 1; display: flex; overflow: hidden; }

/* Sidebar */
.sidebar { width: 260px; background: var(--sidebar); color: white; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
.sidebar-header { padding: 24px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.sidebar-badge { background: var(--accent); font-family: var(--serif); font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 99px; letter-spacing: -0.01em; }
.sidebar-title { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.sidebar-rep { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.4); }
.sidebar-rep strong { color: rgba(255,255,255,0.75); font-weight: 600; }
.sidebar-nav { flex: 1; padding: 14px 10px; }
.ssi { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background 0.12s; margin-bottom: 2px; }
.ssi:hover:not(.locked) { background: var(--sidebar-hover); }
.ssi.active { background: rgba(24,71,240,0.22); }
.ssi.locked { opacity: 0.4; cursor: not-allowed; }
.ssi-num { width: 24px; height: 24px; border-radius: 7px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.ssi-num.done { background: var(--success); }
.ssi-num.lock { background: rgba(255,255,255,0.05); font-size: 12px; }
.ssi-info { flex: 1; min-width: 0; }
.ssi-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ssi-sub { font-size: 11px; color: rgba(255,255,255,0.38); margin-top: 1px; }
.ssi-pct { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 2px; }
.sidebar-footer { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,0.07); }
.sidebar-admin-link { font-size: 11px; color: rgba(255,255,255,0.28); cursor: pointer; text-align: center; padding: 6px; border-radius: 8px; transition: color 0.15s; letter-spacing: 0.03em; }
.sidebar-admin-link:hover { color: rgba(255,255,255,0.6); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
#main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

/* Topbar */
.topbar { padding: 14px 36px; border-bottom: 1px solid var(--border); background: var(--white); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.topbar-breadcrumb { font-size: 13px; color: var(--muted); }
.topbar-breadcrumb strong { color: var(--text); font-weight: 600; font-family: var(--serif); font-size: 14px; }
.topbar-spacer { flex: 1; }
.topbar-progress { display: flex; align-items: center; gap: 10px; }
.topbar-progress-label { font-size: 11px; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
.progress-bar-wrap { width: 120px; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.topbar-page-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Reader */
.reader-wrap { flex: 1; overflow-y: auto; padding: 52px 36px; min-height: 0; background: var(--bg); }
.reader-inner { max-width: var(--reader-max); margin: 0 auto; }
.reader-inner h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; margin-bottom: 6px; line-height: 1.18; letter-spacing: -0.025em; color: var(--text); }
.reader-inner .page-subtitle { font-size: 15px; color: var(--muted); margin-bottom: 36px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
.reader-inner h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 32px 0 12px; letter-spacing: -0.02em; color: var(--text); }
.reader-inner h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 22px 0 8px; letter-spacing: -0.01em; color: var(--text); }
.reader-inner p { font-size: 15px; line-height: 1.78; color: #4A4540; margin-bottom: 15px; }
.reader-inner ul, .reader-inner ol { padding-left: 22px; margin-bottom: 15px; }
.reader-inner li { font-size: 15px; line-height: 1.72; color: #4A4540; margin-bottom: 6px; }
.reader-inner strong { font-weight: 600; color: var(--text); }

/* Callouts */
.callout { border-radius: 12px; padding: 16px 20px; margin: 22px 0; font-size: 14px; line-height: 1.65; }
.callout-accent { background: var(--accent-light); border-left: 3px solid var(--accent); }
.callout-warn { background: var(--warn-bg); border-left: 3px solid var(--warn); }
.callout-success { background: var(--success-bg); border-left: 3px solid var(--success); }
.callout-dark { background: var(--surface); border-left: 3px solid var(--border); }
.callout-title { font-weight: 700; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; }
.callout-accent .callout-title { color: var(--accent); }
.callout-warn .callout-title { color: var(--warn); }
.callout-success .callout-title { color: var(--success); }
.callout-dark .callout-title { color: var(--muted); }

/* Talk track */
.talk-track { background: var(--white); border: 1.5px solid var(--border); border-radius: 12px; padding: 22px 24px 22px 36px; margin: 22px 0; font-size: 15px; line-height: 1.8; color: #2A2820; font-family: var(--serif); font-style: italic; position: relative; }
.talk-track::before { content: '"'; font-size: 72px; color: var(--border); position: absolute; top: -6px; left: 14px; font-family: var(--serif); line-height: 1; }
.talk-track-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 10px; font-style: normal; }

/* Do/Don't */
.do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0; }
.do-block { background: var(--success-bg); border: 1px solid #C5D49A; border-radius: 12px; padding: 16px; }
.dont-block { background: #FBF0EE; border: 1px solid #F0C4BA; border-radius: 12px; padding: 16px; }
.do-block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--success); margin-bottom: 8px; }
.dont-block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #A8360A; margin-bottom: 8px; }
.do-block li, .dont-block li { font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 4px; }

/* Nav footer */
.reader-nav { padding: 16px 36px; border-top: 1px solid var(--border); background: var(--white); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.btn-nav { display: flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 99px; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; font-family: inherit; border: 1.5px solid var(--border); background: transparent; color: var(--text); transition: all 0.15s; }
.btn-nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-nav-primary { background: var(--accent); color: white; border-color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; font-size: 12px; }
.btn-nav-primary:hover:not(:disabled) { background: #0F35CC; border-color: #0F35CC; color: white; }
.nav-center { font-size: 13px; color: var(--muted); }

/* Dashboard */
.dashboard-wrap { flex: 1; overflow-y: auto; padding: 44px 36px; min-height: 0; background: var(--bg); }
.dashboard-inner { max-width: 880px; margin: 0 auto; }
/* Dashboard tabs */
.dash-tabs { display: flex; gap: 4px; margin-bottom: 32px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 4px; width: fit-content; }
.dash-tab { padding: 8px 22px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted); transition: all 0.15s; }
.dash-tab.active { background: var(--white); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
/* Scores tab */
.scores-section { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
.scores-section-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.scores-section-header h3 { font-size: 15px; font-weight: 700; }
.scores-item { padding: 16px 22px; border-bottom: 1px solid var(--border); }
.scores-item:last-child { border-bottom: none; }
.scores-item-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 4px; }
.scores-item-prompt { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.scores-item-answer { font-size: 13px; color: var(--text); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
.scores-feedback { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #eff6ff; border-radius: 8px; border: 1px solid #bfdbfe; }
.scores-stars { color: #f59e0b; font-size: 15px; letter-spacing: 1px; }
.scores-note { font-size: 13px; color: #1d4ed8; font-style: italic; }
.scores-empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
.scores-summary { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 22px 24px; margin-bottom: 24px; display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.scores-stat { text-align: center; }
.scores-stat-num { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; }
.scores-stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.dashboard-header { margin-bottom: 32px; }
.dashboard-header h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.025em; }
.dashboard-header p { font-size: 15px; color: var(--muted); }
.section-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.section-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; cursor: pointer; transition: all 0.15s; position: relative; }
.section-card:hover:not(.locked) { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(24,71,240,0.1); }
.section-card.complete { border-color: #C5D49A; }
.section-card.locked { opacity: 0.5; cursor: not-allowed; }
.sc-num { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.sc-title { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.02em; line-height: 1.2; }
.sc-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.sc-meta { display: flex; align-items: center; gap: 12px; }
.sc-pages { font-size: 12px; color: var(--muted); }
.sc-status { font-size: 11px; font-weight: 600; padding: 3px 12px; border-radius: 99px; letter-spacing: 0.03em; }
.sc-status.not-started { background: var(--surface); color: var(--muted); }
.sc-status.in-progress { background: var(--warn-bg); color: var(--warn); }
.sc-status.submitted { background: var(--accent-light); color: var(--accent); }
.sc-status.complete { background: var(--success-bg); color: var(--success); }
.sc-status.locked { background: var(--surface); color: var(--locked); }
.sc-progress-bar { margin-top: 18px; height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.sc-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.section-card.complete .sc-progress-fill { background: var(--success); }
.overall-progress { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; margin-bottom: 20px; display: flex; align-items: center; gap: 24px; }
.op-ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
.op-ring svg { transform: rotate(-90deg); }
.op-ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.op-info h2 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.02em; }
.op-info p { font-size: 13px; color: var(--muted); }

/* Homework page */
.hw-wrap { max-width: var(--reader-max); margin: 0 auto; }
.hw-header { margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.hw-header h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.02em; }
.hw-header p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.hw-group { margin-bottom: 32px; }
.hw-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1.5px solid var(--accent-light); }
.hw-item { margin-bottom: 20px; }
.hw-item-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; }
.hw-item-prompt { font-size: 14px; color: var(--text); margin-bottom: 9px; line-height: 1.55; font-weight: 500; }
.hw-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; background: var(--white); color: var(--text); }
.hw-input:focus { border-color: var(--accent); }
.hw-textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; resize: vertical; min-height: 80px; background: var(--white); color: var(--text); }
.hw-textarea:focus { border-color: var(--accent); }
.hw-link-note { display: flex; flex-direction: column; gap: 8px; }
.hw-submitted-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--success-bg); color: var(--success); font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 99px; margin-bottom: 16px; letter-spacing: 0.03em; }
.hw-answer-readonly { background: var(--surface); border-radius: 10px; padding: 11px 14px; font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.hw-feedback-block { margin-top: 8px; background: var(--warn-bg); border-radius: 8px; padding: 9px 13px; font-size: 12px; color: var(--warn); }
.hw-feedback-block strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }

/* Admin */
.admin-gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg); }
.admin-gate-card { background: var(--white); border-radius: 16px; padding: 44px; width: 100%; max-width: 400px; border: 1.5px solid var(--border); }
.admin-wrap { flex: 1; overflow-y: auto; padding: 36px; min-height: 0; background: var(--bg); }
.admin-inner { max-width: 920px; margin: 0 auto; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.admin-header h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.rep-table { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; }
.rep-table-head { display: grid; grid-template-columns: 1fr 100px 100px 120px; padding: 11px 22px; background: var(--surface); border-bottom: 1px solid var(--border); }
.rep-table-head span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.rep-row { display: grid; grid-template-columns: 1fr 100px 100px 120px; padding: 15px 22px; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; transition: background 0.12s; }
.rep-row:last-child { border-bottom: none; }
.rep-row:hover { background: var(--bg); }
.rep-name { font-size: 14px; font-weight: 600; }
.rep-email { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rep-cell { font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; padding: 3px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }
.pill-green { background: var(--success-bg); color: var(--success); }
.pill-blue { background: var(--accent-light); color: var(--accent); }
.pill-yellow { background: var(--warn-bg); color: var(--warn); }
.pill-gray { background: var(--surface); color: var(--muted); }
.btn-sm { padding: 7px 18px; border-radius: 99px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; font-family: inherit; border: 1.5px solid var(--border); background: transparent; color: var(--text); transition: all 0.15s; }
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-sm-primary:hover { background: #0F35CC; }
.btn-sm-danger { background: transparent; color: #A8360A; border-color: #F0C4BA; }

/* Grade view */
.grade-section { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; margin-bottom: 16px; }
.grade-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.grade-section-header h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.qa-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--bg); }
.qa-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.qa-question { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
.qa-answer { font-size: 13px; color: #4A4540; background: var(--bg); border-radius: 8px; padding: 10px 13px; margin-bottom: 9px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.qa-grade-row { display: flex; align-items: center; gap: 10px; }
.star-row { display: flex; gap: 4px; }
.star { font-size: 18px; cursor: pointer; color: var(--border); transition: color 0.1s; line-height: 1; }
.star.on { color: #C8960A; }
.grade-note { flex: 1; padding: 6px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; outline: none; background: var(--bg); color: var(--text); }
.grade-note:focus { border-color: var(--accent); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--sidebar); color: white; padding: 11px 22px; border-radius: 99px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Animations */
.fade-in { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
/* ── Lightbox ───────────────────────────────────────── */
#lightbox-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.82); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; cursor: zoom-out;
}
#lightbox-overlay.open { display: flex; }
#lightbox-overlay img {
  max-width: 92vw; max-height: 90vh;
  border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  object-fit: contain; cursor: default;
}
#lightbox-close {
  position: absolute; top: 20px; right: 24px;
  color: #fff; font-size: 28px; line-height: 1;
  cursor: pointer; opacity: 0.7; transition: opacity .15s;
  background: none; border: none; font-family: inherit;
}
#lightbox-close:hover { opacity: 1; }
.reader-inner img, .expandable-img { transition: opacity .15s; cursor: zoom-in; }
.reader-inner img:hover, .expandable-img:hover { opacity: .88; }

/* ── Print / PDF export ───────────────────────────────────────────────────── */
@media print {
  /* Hide everything that isn't the scorecard content */
  .sidebar, .topbar, .reader-nav, .no-print,
  #btn-back-home, #btn-back-list, #btn-export-pdf, #btn-export-csv,
  #btn-save-capstone, #capstone-gong-url,
  .star-row, input.grade-note { display: none !important; }

  /* Remove scrolling constraints — let content flow to pages */
  html, body, #app, .admin-wrap { overflow: visible !important; height: auto !important; }
  .admin-wrap { padding: 0 !important; background: #fff !important; }
  .admin-inner { max-width: 100% !important; }

  /* Stars — show filled ones as solid, empty as outline, no pointer */
  .star { color: #ccc; font-size: 16px; }
  .star.on { color: #f59e0b; }

  /* Print-only rep name header */
  .print-header { display: block !important; }

  /* Keep sections together and break cleanly between them */
  .grade-section { break-inside: avoid; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }

  /* Show saved values of hidden inputs as inline text via data-val attribute */
  .grade-note-print { display: inline !important; font-style: italic; color: #555; }

  .pill-green { background: #dcfce7 !important; color: #166534 !important; }
  .pill-gray  { background: #f1f5f9 !important; color: #475569 !important; }

  /* Capstone gong URL — show as text */
  .capstone-url-print { display: block !important; font-size: 12px; color: #6366f1; word-break: break-all; }

  .qa-grade-row { margin-top: 6px; display: flex; align-items: center; gap: 10px; }
}

/* Print-only elements hidden on screen */
.print-header { display: none; }
.grade-note-print { display: none; }

      <p class="page-subtitle">This is your reference — what each feature actually does, how it's set up, and where its limits are. The next section (The Demo) covers how to show this; this section is what you reach for when a prospect asks something off-script and you need the real answer.</p>
      <p>This section provides an in-depth overview of the different product categories inside the Skio platform. For specific technical questions, try using #ask-echo in Slack and then ask a SE.</p>
      <p>The section is organized the way Skio itself is — by <strong>Acquisition</strong> (getting new subscribers) and <strong>Retention</strong> (keeping them). Skio's own dashboard splits into an Acquire and a Retain menu, so this mirrors what you'll see on screen.</p>
      <div class="callout callout-warn"><div class="callout-title">⚠️ Be honest about limits</div>This section names what Skio does NOT do (post-purchase upsells, widget A/B testing, etc.). Knowing the gaps cold makes you more credible, not less — and stops you from promising something in a demo that the product can't deliver.</div>
      <div style="display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <h2 style="margin-top:0;">🔵 Acquisition: getting new subscribers</h2>
          <ul>
            <li>The Subscription Widget (PDP)</li>
            <li>Bundles / Build-a-Bundle</li>
            <li>Checkout Link Builder</li>
            <li><strong>Component Library</strong> — Cart &amp; Checkout Upsells</li>
          </ul>
          <h2>🟢 Retention: keeping subscribers</h2>
          <ul>
            <li>Customer Portal (CPv3)</li>
            <li>Backup Payment Methods</li>
            <li>Payment Recovery (Dunning)</li>
            <li>Splash Screens &amp; Cancellation Flows</li>
            <li>Loyalty</li>
            <li>Journeys</li>
            <li>Segments</li>
            <li>Winbacks · SkioSMS · Analytics &amp; Reporting · Email Notifications</li>
          </ul>
        </div>
        <div style="flex:0 0 300px;min-width:220px;">
          <img src="images/component-library.png" alt="Skio Component Library" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.08);">
          <p style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center;">Skio Component Library — pre-built, customizable widgets</p>
        </div>
      </div>
`},
    { id:'s2p2', title:'Subscription Widget', content:`
      <h2>🔵 Acquisition · The Subscription Widget (PDP)</h2>
      <p>This is the subscribe-and-save selector on the product page — where a shopper chooses one-time vs. subscription, frequency, and plan.</p>
      <ul>
        <li><strong>OOTB or custom.</strong> Skio supports both an out-of-the-box widget and fully custom widgets.</li>
        <li><strong>Migrating in?</strong> The launch team matches your current design. If a merchant is coming off a competing solution, Skio's launch team rebuilds the existing widget's look — no agency or dev required. This is a strong migration talking point.</li>
        <li><strong>Want something brand-new/different?</strong> That's on the merchant to design and build — Skio's team matches an existing widget, it doesn't design net-new custom ones for you.</li>
        <li><strong>Setup works just like Recharge.</strong> You create selling plans, attach them to products, and use Shopify's theme editor + app block configuration to place the widget on the storefront. Reps who know the Recharge flow already know this.</li>
      </ul>
      <div style="display:flex;gap:16px;margin:24px 0;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;text-align:center;">
          <img src="images/widget-turnkey.png" alt="Turnkey subscription widget" style="width:100%;max-width:280px;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);">
          <p style="font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;">Out-of-the-box widget</p>
        </div>
        <div style="flex:1;min-width:200px;text-align:center;">
          <img src="images/widget-gruns.png" alt="Custom widget — Grüns" style="width:100%;max-width:280px;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);">
          <p style="font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;">Custom widget — Grüns</p>
        </div>
      </div>
      <h2>🔵 Acquisition · The Component Library</h2>
      <p>Skio's Component Library is a set of <strong>pre-built, customizable widgets to help you grow your subscription program</strong> — beyond just the PDP widget. Think of it as a toolkit of acquisition touchpoints you can deploy across the storefront without custom dev work.</p>
      <p>Current components include:</p>
      <ul>
        <li><strong>Subscription Widget</strong> — the core PDP subscribe-and-save selector (covered above)</li>
        <li><strong>Collection Page Upsell</strong> — surfaces subscription options on browse/collection pages, before the customer even hits a PDP</li>
        <li><strong>Cart Upsell</strong> — prompts a one-time buyer in the cart to switch to a subscription and save (Skio now supports this natively — a recent addition)</li>
        <li><strong>"Add to Subscription" Upsell</strong> — for logged-in subscribers, lets them add a product to an existing subscription from anywhere on the storefront; no portal visit required</li>
      </ul>
      <div style="margin:20px 0;"><img src="images/component-library.png" alt="Skio Component Library" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.08);"></div>
      <div class="callout callout-success"><div class="callout-title">✅ Upsell coverage — updated</div>Skio now supports <strong>checkout upsells</strong> (via Shopify's checkout extensions) <strong>and in-cart upsells</strong> via the Component Library.<br><br>The one genuine gap that remains: <strong>post-purchase upsells</strong> (Recharge supports these; Skio does not). If a prospect specifically needs post-purchase, flag it honestly — don't imply otherwise in a demo.</div>
      <div class="callout callout-dark"><div class="callout-title">A/B testing the widget — context before you use this</div>This reframe is most relevant when you're speaking to a merchant who has <em>already used Recharge</em> and specifically asks about widget A/B testing. It's unlikely to come up cold with a net-new prospect — don't introduce it unprompted.<br><br>If it does come up: "We looked into A/B testing the widget pretty deeply as we enhanced our tech. The problem with testing price on the widget is you'd have two customers on the same site — one sees $39, one sees $34 — and neither converts because they don't trust the price. What we do instead is segmentation: take that same test, apply it to a defined cohort, let it run, and measure against your baseline. You get the data without undermining your brand."</div>
`},

    { id:'s2p3', title:'Bundles & Checkout Links', content:`
      <h2>🔵 Acquisition · Bundles / Build-a-Box</h2>
      <p>Skio has a native Build-a-Box — no third-party app required. Four box types, all out-of-the-box:</p>
      <div style="display:grid;gap:12px;margin:20px 0;">
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);margin-bottom:6px;">Box Type 1</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Dynamic Box — Quantity Based</div>
          <div style="font-size:13px;color:var(--muted);">Buy more items, save more. The discount scales up as a subscriber adds products and scales back down if they remove them. Classic "buy more, save more" volume logic.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);margin-bottom:6px;">Box Type 2</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Dynamic Box — Price Based</div>
          <div style="font-size:13px;color:var(--muted);">Spend more money, save more. Discount tiers are triggered by cart value rather than item count — rewards customers for increasing their order value.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);margin-bottom:6px;">Box Type 3</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Static Box</div>
          <div style="font-size:13px;color:var(--muted);">Fixed product counts tied to fixed prices. For example: 4 items for $10, 6 items for $12. Simple, predictable pricing — best for brands that want structured tier options without dynamic scaling.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--accent);margin-bottom:6px;">Box Type 4</div>
          <div style="font-weight:700;font-size:15px;margin-bottom:4px;">Sectioned Box</div>
          <div style="font-size:13px;color:var(--muted);">Groups of dynamic boxes organized by product catalog or category. Customers choose X items from this collection, Y items from that collection. Think "build your own starter kit" — pick 2 proteins, 2 greens, 1 recovery.</div>
        </div>
      </div>
      <div style="margin:24px 0;"><img src="images/build-a-box-types.png" alt="Skio Build-a-Box types" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.08);"></div>
      <div class="callout callout-success"><div class="callout-title">💡 Why this wins deals</div>Dynamic/volume bundling is something competitors have struggled to deliver. Aloha went through 3 agencies and 3 failed builds elsewhere before moving to Skio for this specifically. Mozy moved for the same reason. When a brand with a multi-SKU catalog hears this, it lands.<br><br><strong>See it live:</strong> <a href="https://aloha.com/pages/build-your-own-bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Aloha</a> · <a href="https://www.weheartnutrition.com/pages/bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">WeHeartNutrition</a> · <a href="https://justingredients.com/pages/protein-bundle-builder" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Just Ingredients</a> · <a href="https://shop.bulletproof.com/collections/build-your-own-bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Bulletproof Coffee</a></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>🔵 Acquisition · Checkout Link Builder</h2>
      <div class="callout callout-accent"><div class="callout-title">🎥 See it in action</div><a href="https://app.avoma.com/meetings/38481b94-4325-4de4-bc36-dd0cf1b5dc62/transcript/?t=1952.6951" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">▶ Watch how Greg pitches the Checkout Link Builder in this clip <span style="font-weight:400;color:var(--muted);">(jump to 33:07 if it doesn't load at the right spot)</span></a></div>
      <p>Found under the <strong>Acquire</strong> dropdown in the Skio dashboard. It generates prefilled, direct-to-checkout links: you add one or more products, set quantities, and optionally apply a discount code, and Skio produces a single URL that drops the shopper straight into Shopify checkout with the right product and selling plan already attached.</p>
      <h3>Why it's an acquisition tool:</h3>
      <ul>
        <li><strong>Removes friction</strong> — skips the PDP and cart entirely, so a campaign click goes right to checkout as a subscriber.</li>
        <li><strong>Built for campaigns</strong> — ideal for ads, promos, PDP buttons, and influencer/affiliate links where you want the fewest possible clicks to a subscription.</li>
        <li><strong>Discount baked in</strong> — a promo code applied to the link auto-applies at checkout, so the offer and the path are one and the same.</li>
      </ul>
      <div class="callout callout-dark"><div class="callout-title">Position it against its retention cousin</div><strong>Checkout Link Builder = ACQUISITION</strong> (get new customers subscribed). Its counterpart, Quick Actions, = <strong>RETENTION</strong> (authenticated links that let existing subscribers skip, swap, update card, etc.). Same "one link" idea, opposite ends of the lifecycle. We'll cover Quick Actions in the Retention part.</div>
`},

    { id:'s2p4', title:'Customer Portal (CPv3)', content:`
      <h2>🟢 Retention · Customer Portal (CPv3)</h2>
      <p>The customer portal is where subscribers manage their accounts. Just as Recharge has Affinity v1 and v2, Skio has evolved through CPv1, CPv2, and CPv3. We focus on CPv3, the current portal. It's a real-time drag-and-drop builder: you control the branding, which actions customers can take, and how everything is laid out.</p>
      <h3>What's new in v3</h3>
      <div style="display:flex;gap:16px;margin:16px 0 20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:180px;text-align:center;">
          <img src="images/card-based-view.png" alt="CPv3 card-based subscription view" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Card-based subscription view</p>
        </div>
        <div style="flex:1;min-width:180px;text-align:center;">
          <img src="images/cpv3.png" alt="CPv3 customer portal" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Inside a subscription (CPv3)</p>
        </div>
      </div>
      <ul>
        <li><strong>Card-based subscription view.</strong> Customers with more than one subscription see them all in a scannable 2×2 card grid instead of a long vertical list. Customers with a single subscription are taken straight to that subscription when they open the portal.</li>
        <li><strong>Simplified action buttons.</strong> Key actions appear as prominent buttons at the top of each subscription (Get now, Skip, and a "More" menu for additional actions) instead of hunting through the interface.</li>
        <li><strong>Full merchant customization.</strong> You control colors and branding, which actions customers can take, and how the buttons are organized — so the portal matches your brand and supports your retention strategy.</li>
      </ul>
      <h3>Inside a subscription (View details)</h3>
      <p>Clicking a card opens the full management view: action buttons (Get now, Skip, More), line items with +/− quantity controls, shipping address, payment method, order summary, and an order history tab showing ALL orders including non-subscription orders.</p>
      <div class="callout callout-accent"><div class="callout-title">◆ KEY DIFFERENCE vs. RECHARGE</div>The Order History tab shows ALL customer orders, including non-subscription orders. Recharge did not support this.</div>
      <h3>Available actions (you choose which are on)</h3>
      <p>CPv3 supports: Get now · Skip · Pause · Edit frequency · Next order date · Apply discount · Cancel · Merge · Split · Product skip · Gift on skip · Quantity editing. You decide which are available and how they're organized in the experience settings.</p>
      <h3>What does it mean to merge or split subscriptions?</h3>
      <ul>
        <li><strong>Merging</strong> combines multiple active subscriptions for the same customer into one. This helps reduce fulfillment complexity by creating a single bill and shipment for all products in the merged subscription.</li>
        <li><strong>Splitting</strong> does the opposite: it separates products from one subscription into multiple subscriptions. This gives customers more flexibility — for example, if they want different items shipped to different addresses or on different billing dates.</li>
      </ul>
      <p>Both options give you more control over how subscriptions are managed on behalf of your customers, while keeping operations streamlined.</p>
      <div class="callout callout-warn"><div class="callout-title">⚠️ Split limitation — know this</div>The Split action does not appear for subscriptions that are <strong>prepaid</strong>, contain a <strong>one-time upsell</strong>, contain <strong>surprise &amp; delight products</strong>, or have <strong>discounts applied</strong>.</div>
      <h3>Login &amp; Accounts</h3>
      <ul>
        <li><strong>Passwordless login.</strong> A subscriber enters their email and gets a 4-digit 2FA code by email (and by text to the phone on file if there is one).</li>
        <li><strong>Stays logged in.</strong> After a subscriber logs in once, Skio keeps them logged in on that device, making future management easier.</li>
        <li><strong>Auto-created accounts.</strong> Skio automatically creates and activates a Skio account at checkout — no more activation complaints from frustrated subscribers. Note: this doesn't replace the Shopify customer account.</li>
      </ul>
`},
    { id:'s2q3', type:'quiz', title:'Check Yourself · Customer Portal', quizGroupIndices:[3] },
    { id:'s2p5', title:'Payment Methods & Recovery', content:`
      <h2>🟢 Retention · The Portal Builder</h2>
      <p>The portal settings page is a real-time, drag-and-drop builder. As you change colors, splash images, banners, or button text, the preview updates instantly. Toggle the right-hand preview across views (subscription detail, subscription overview, order history, and the login screen) and switch between desktop and mobile. When done, click <strong>Publish</strong> (top right) — changes go live immediately.</p>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>🟢 Retention · Backup Payment Methods</h2>
      <p>Customers can add multiple cards, including a backup payment method. Backup payment methods reduce involuntary churn: if a subscriber's primary card fails, Skio automatically retries the charge on their backup card. They must be enabled in your Skio dashboard. Customers add and manage them two ways: through the Customer Portal (if enabled in portal settings), or via a Quick Action link.</p>
      <div style="display:flex;gap:16px;margin:20px 0;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:160px;text-align:center;">
          <img src="images/add-backup-method.png" alt="Add backup payment method prompt" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Customer sees prompt to add a backup card</p>
        </div>
        <div style="flex:1;min-width:160px;text-align:center;">
          <img src="images/enter-card-details.png" alt="Enter card details modal" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Card entry modal</p>
        </div>
      </div>
      <h3>Sending a backup-payment Quick Action link:</h3>
      <ul>
        <li>Skio Dashboard → Grow → Quick Actions</li>
        <li>Create new action → Modify existing subscription</li>
        <li>Select the action: Set backup payment method</li>
        <li>Choose link type: Universal, Klaviyo, Sendlane, or Skio</li>
        <li>(Optional) Attach a discount code as an incentive — set to "once per customer" to prevent reuse</li>
      </ul>
      <div class="callout callout-success"><div class="callout-title">💡 Best practices</div>Regularly remind customers to add/update a backup card via email (in Klaviyo you can filter out those who already have one). Offer a small discount to incentivize setup. Use both the portal callout and Quick Actions so customers have the easiest path to add and manage backup cards.</div>
`},

    { id:'s2p6', title:'Cancellation Flows', content:`
      <h2>🟢 Retention · Payment Recovery (Dunning)</h2>
      <p>Payment Recovery manages failed subscription renewals during the dunning window — the period that opens when a payment fails and closes when the subscription either renews successfully or cancels. It expands on traditional dunning with flexible, multi-phase retry logic: instead of a single retry limit, you build adaptive recovery campaigns with multiple retry phases, each with its own number of billing attempts and intervals.</p>
      <ul>
        <li><strong>Retry the card first.</strong> Attempt multiple retries on the card on file before emailing the subscriber. About 15% of failed payments recover automatically with no customer action — fewer emails, lower cancellation risk, fewer support tickets, and a smoother experience.</li>
        <li><strong>Smart Retries</strong> automatically optimize when retries fire (best time of day, day of week, and day of month) using Skio's data model. Your configured total number of retries is always respected, but Skio may adjust the interval for a more effective schedule.</li>
      </ul>
      <h3>Best practices</h3>
      <ul>
        <li>Enable Smart Retries — the single highest-leverage setting.</li>
        <li>Configure the first two phases with back-to-back retries on the card, then offer a discount in a third phase.</li>
        <li>Only email the customer after multiple on-file retries in phases 1–2.</li>
      </ul>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>🟢 Retention · Splash Screens</h2>
      <p>A splash screen is a temporary modal that appears before the cancel flow officially begins — a "Before you go" moment. It usually holds a video (a founder message or a light/funny clip) that nudges the subscriber toward an alternate action instead of canceling. It's the first line of defense before any survey or treatment step.</p>
      <ul>
        <li>Any action can be attached: Skip, swap, choose a specific next order date, order now, pause, or send them to an external link.</li>
        <li>Segmented — run multiple splash screens based on conditions and customer segments.</li>
      </ul>
      <div style="margin:20px 0;text-align:center;">
        <img src="images/splashscreen.gif" alt="Splash screen in action" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
        <p style="font-size:11px;color:var(--muted);margin-top:6px;">Splash screen — the "Before you go" moment before the cancel flow begins</p>
      </div>
      <div class="callout callout-success"><div class="callout-title">📊 Impact worth quoting</div>Adding a splash screen alone has reduced cancellations by ~18% for some merchants.</div>
      <h2>🟢 Retention · Cancellation Flows</h2>
      <div class="callout callout-accent"><div class="callout-title">✅ Good news for Recharge reps — this will feel familiar</div>Skio's cancel flow works the same way as Recharge's. Same logic, same structure — just more powerful. If you've built a cancel flow in Recharge before, you already understand this. The upgrades are the depth of segmentation, the A/B testing at the flow level, and the visual builder.</div>
      <p>The cancel flow is triggered the moment a subscriber clicks "Cancel." Here's how the logic runs:</p>
      <ol>
        <li><strong>Cancellation action triggers the flow.</strong> The subscriber clicks cancel in the portal — this kicks off the sequence.</li>
        <li><strong>Conditions filter the customer.</strong> Before anything is shown, Skio checks which flow this customer should see based on rules you define — order count, LTV, product, segment, and more. If they qualify for multiple flows, conflict resolution picks the right one automatically.</li>
        <li><strong>Cancellation reason is presented.</strong> The customer picks why they're canceling from a set of randomized reasons you configure.</li>
        <li><strong>Treatment is served based on their reason.</strong> The right retention offer fires — a discount, a pause, a skip, a swap — matched to what they chose.</li>
      </ol>
      <div style="display:flex;gap:16px;margin:20px 0;flex-wrap:wrap;align-items:flex-start;">
        <div style="flex:1;min-width:200px;text-align:center;">
          <img src="images/condition-cancel.png" alt="Cancel flow conditions" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Step 2 — Conditions filter which flow the customer enters</p>
        </div>
        <div style="flex:1;min-width:200px;text-align:center;">
          <img src="images/reason-treatment.png" alt="Cancellation reason and treatment" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
          <p style="font-size:11px;color:var(--muted);margin-top:6px;">Steps 3 &amp; 4 — Reason selected → treatment served</p>
        </div>
      </div>
      <h3>Node types (the building blocks):</h3>
      <ul>
        <li><strong>Splash Screen:</strong> the "Before you go" modal; sits ahead of the main flow — covered on the previous page.</li>
        <li><strong>Cancellation Reason:</strong> selectable reasons a customer can pick; randomized on entry.</li>
        <li><strong>Treatment:</strong> the retention offer shown based on the selected reason (discount, pause, skip next order, etc.).</li>
        <li><strong>Split Treatments:</strong> randomly split customers between different treatment paths to test strategies.</li>
      </ul>
      <div class="callout callout-dark"><div class="callout-title">Split Treatments vs. A/B testing</div><strong>Split Treatments</strong> split customers across treatment paths within a single flow.<br><strong>A/B testing</strong> operates at the flow level: direct a set % of customers to flow A vs. flow B for measured results.</div>
`},
    { id:'s2q5', type:'quiz', title:'Check Yourself · Cancel Flows', quizGroupIndices:[6] },
    { id:'s2p7', title:'Journeys', content:`
      <h2>🟢 Retention · Journeys</h2>
      <div class="callout callout-accent"><div class="callout-title">💰 The money-maker moment</div>Journeys is the feature that consistently gets the strongest reaction in demos and pitches. Lead with it when you want to make something click that nothing else in the deck can. The pitch in one line: <strong>Journeys replaces what merchants used to need a developer, an API, and a webhook setup to accomplish — and turns it into a two-minute drag-and-drop build.</strong><br><br>For any merchant who has ever said "we'd love to do X but we'd need dev resources to build it" — this is the answer. Show it live, build one on the call, and let the reaction speak for itself.<br><br>🎥 <a href="https://app.avoma.com/meetings/14524aec-52d2-415b-956a-f33c9284f52f/transcript/?t=532.45496" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">See how Noah pitches Journeys for quantity upsell banners in the portal</a> <span style="font-weight:400;color:var(--muted);">(starts at 8:52 if it doesn't jump there automatically)</span></div>
      <div class="callout callout-warn"><div class="callout-title">🛠️ Do this before your capstone</div>Journeys is the one feature where you need hands-on reps before you demo it live. Spend time in your demo store building a few Journeys from scratch — try a trial-to-full-size product swap, a high-discount order 1 → lower discount order 2, and a streak-based credit reward. The confidence that comes from having built them yourself is what makes the "watch how fast this is" moment land. If you fumble it in the demo, the magic is gone.</div>
      <p>Journeys is Skio's visual workflow builder — a drag-and-drop way to automate subscription changes across the customer lifecycle. You build "if this, then that" logic that responds to real-time events (an order placed, a product added, a billing date changed), with no code and deep integrations like Klaviyo.</p>
      <p>Under the hood, Journeys is essentially a <strong>no-code interface for API calls and webhooks</strong>. Anything a developer would have wired up manually — listen for an event, check a condition, fire an action — Journeys does visually, with no engineering involvement after the initial setup. Custom subscription workflows that used to take sprint cycles now take minutes.</p>
      <h3>How it works — three node types</h3>
      <ul>
        <li><strong>Trigger node</strong> — when the Journey begins (e.g., after an order, after a product change).</li>
        <li><strong>Condition node</strong> — the rules that decide which customers follow which path.</li>
        <li><strong>Action node</strong> — what happens (swap product, apply discount, send notification, etc.).</li>
      </ul>
      <h3>Common use cases</h3>
      <ul>
        <li>Trial-to-full-size conversions — automatically swap a trial SKU for the full-size product after a set cycle, adjusting the price.</li>
        <li>High-discount order 1 → change discount on order 2.</li>
        <li>Bundle expansion / kit splitting — break a bundled SKU into individual products at a chosen point.</li>
        <li>Lifecycle upsell &amp; cross-sell — add one-time or recurring products after key actions or thresholds.</li>
      </ul>
      <h3>Triggers (when a Journey starts)</h3>
      <ul>
        <li><strong>After order</strong> — fires after an order completes. Use the Order number filter to distinguish checkout from recurring.</li>
        <li><strong>After a product is added</strong> — fires when a product is added or removed from a subscription. Key callout: it also triggers on product removal despite the name — flip the Quantity changes toggle to fire on removals too.</li>
        <li><strong>After next manual billing date change</strong> — fires after a manual change via Quick Actions or the Customer Portal.</li>
      </ul>
      <div class="callout callout-dark"><div class="callout-title">Trigger filters vs. conditions</div><strong>Trigger filters</strong> control which ORDERS trigger the flow. <strong>Conditions</strong> determine which CUSTOMERS go down each path after it's triggered.</div>
      <h3>Actions (what happens)</h3>
      <p>Swap product · Add discount · Add product · Change delivery price · Change interval · Trigger banner · Update product price · Adjust next billing date · Notification (email, SMS, or integration event) · Bundle expansion · Delay · Remove products · Remove discounts · Pause subscription · Award credits · Sunset prepaid.</p>
      <p><strong>Prebuilt templates:</strong> Product swap · Upgrade suggestion · Change discount over time.</p>
`},

    { id:'s2p8', title:'Segments, Loyalty & SMS', content:`
      <h2>🟢 Retention · Segments</h2>
      <p>A Segment is a filtered view of your subscriptions that meet conditions you define. Use them to compare performance between subscriber groups, export targeted lists for campaigns, and focus analytics on a subset. Segments are the thread that connects the rest of the platform — the same logic layer powers journeys, cancel flows, and reporting.</p>
      <ul>
        <li><strong>Static</strong> — a one-time snapshot of subscribers who met the conditions at creation. Best for point-in-time analysis like cohort comparisons.</li>
        <li><strong>Dynamic</strong> — auto-updates every night, adding and removing subscriptions as they meet (or stop meeting) the criteria. Best for ongoing monitoring and real-time campaign targeting.</li>
      </ul>
      <div class="callout callout-warn"><div class="callout-title">⚠️ Segments can't be edited</div>There's no edit after creation. To change the filters, delete the Segment and create a new one.</div>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>🟢 Retention · Loyalty</h2>
      <div class="callout callout-accent"><div class="callout-title">📖 Dig deeper on your own</div>The full Skio Loyalty product page is worth a read before demoing it. <a href="https://skio.com/loyalty" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Review it here →</a></div>
      <p>Skio Loyalty is a <strong>subscription-first</strong> loyalty program built natively into the platform — not a bolt-on app. The core idea: rewards live inside the same customer portal your subscribers already use to manage their subscriptions, so there's no separate login, no forgotten app, no friction.</p>
      <div style="margin:16px 0 24px;text-align:center;">
        <img src="images/rewards-page.png" alt="Skio Loyalty rewards page" class="expandable-img" style="width:100%;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.08);cursor:zoom-in;">
        <p style="font-size:11px;color:var(--muted);margin-top:6px;">Loyalty rewards page — tiers, credits &amp; referrals in the portal</p>
      </div>
      <h3>How it works</h3>
      <div style="display:grid;gap:10px;margin:16px 0;">
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🏆 Tiers — status that pays off</div>
          <div style="font-size:13px;color:var(--muted);">Create tiers with custom names, badges, and cashback rates. The key differentiator: you can set <strong>different rates for subscribers vs. one-time buyers within the same tier</strong> — say 2% for one-time and 5% for subscribers. One-time buyers see the gap, do the math, and subscribe.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">💳 Credits — flexible reward currency</div>
          <div style="font-size:13px;color:var(--muted);">Reward customers in values they actually understand. They see their balance in the portal, slide to apply at checkout — one click. Works as credits, points, or cash-equivalent, depending on how you brand it.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔁 Action-Based Rewards</div>
          <div style="font-size:13px;color:var(--muted);">Credits aren't just for orders. Trigger rewards when customers subscribe, swap a product, add something to their next order, or hit order streaks. You define which behaviors to reinforce — then it runs automatically.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔥 Streaks</div>
          <div style="font-size:13px;color:var(--muted);">Trigger bonuses when customers hit consecutive renewals without skipping. Three orders in a row, six months without a pause — reward the consistency behavior that actually correlates with long-term retention.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🚪 Cancel Flow Integration — your best save offer</div>
          <div style="font-size:13px;color:var(--muted);">Surface existing credit balances or offer bonus credits when someone tries to cancel. A save offer that doesn't train customers to threaten cancellation just to get a discount.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">📉 Loss Aversion</div>
          <div style="font-size:13px;color:var(--muted);">Show customers what they'll lose — tier status, credits, progress toward the next reward — when they try to cancel, skip, or pause. In-flow modals and targeted messaging reduce churn at the exact moment it's at risk.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔒 Gated Products (Tier-Locked Rewards)</div>
          <div style="font-size:13px;color:var(--muted);">Lock specific rewards or products behind tier status. Gold members get access to limited drops or can redeem credits for exclusive SKUs that aren't available to everyone else.</div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">📊 Loyalty Analytics</div>
          <div style="font-size:13px;color:var(--muted);">Track tier movement, earn vs. redeem rates, credit liability, and breakage. Compare rewarded vs. non-rewarded cohorts to measure actual AOV and retention lift from the program.</div>
        </div>
      </div>
      <div class="callout callout-success"><div class="callout-title">💬 Customer quote worth using</div>"Our customers already loved managing their subscriptions in Skio's portal — adding loyalty to that same seamless experience was a no-brainer. Adoption and point usage increased immediately, and now loyalty is a much bigger lever we can pull to grow our subscription program." — <em>Alec Tremaine, CRO</em></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>🟢 Retention · SkioSMS</h2>
      <p>SkioSMS is Skio's built-in transactional SMS and subscription-management tool. It does two jobs:</p>
      <ul>
        <li><strong>One-way notifications</strong> — automated messages for billing reminders, successful orders, failed payments, skips, and cancellations.</li>
        <li><strong>Two-way subscription management</strong> — customers text back to skip, pause, change an order date, swap products, add items, and more.</li>
      </ul>
      <p>You don't need to bring your own SMS provider or phone number. Skio assigns your store a dedicated Twilio-powered number for transactional subscription messages, included at no additional cost.</p>
      <div class="callout callout-dark"><div class="callout-title">How it fits with Postscript / Attentive / Klaviyo SMS</div>Keep them separate: SkioSMS handles transactional subscription notices + two-way subscription management; your marketing provider handles promotional campaigns. A customer who opts out of marketing texts doesn't also miss important billing or subscription-management messages.</div>
`},

  { id:'s3', num:3, title:'The Demo', subtitle:'How to Run a Great Skio Demo', pages:[
    { id:'s3p1', title:'Demo Overview', content:`
      <h1>Section 3 · The Demo: How to Run a Great Skio Demo</h1>
      <p class="page-subtitle">You each have your own demo store — this section is your run of show for it. We're not covering every feature; we're covering the most important ones in the order you'll demo them. The whole flow below is a live demo against your own store, using the merchant's products and branding wherever possible.</p>
      <div class="callout callout-accent"><div class="callout-title">⏱ Where to spend your time</div><strong>Go deep on:</strong> Customer Portal, Journeys, Cancel Flow, and Volume Discounts. These are the moments that win deals.<br><br><strong>Keep it light on:</strong> PDP widget, Analytics — unless a technical/data buyer is on the call, in which case Analytics is where you win them.<br><br><em>Golden rule: say it, own it, move on. A tight flow beats a feature tour every time.</em></div>
      <div class="callout callout-dark"><div class="callout-title">◆ KEY DIFFERENCE vs. RECHARGE — keep this soundbite ready</div>"Recharge was built 12 years ago, before Shopify's Subscriptions API, so a lot of custom logic is baked in — it's more for complex-API customers. Skio was built after 2020 as a wrapper around the Subscriptions API: faster shipping, faster portal, GraphQL instead of REST. It's just a faster tool, and it's where our R&amp;D is going for brands like yours. A lot of merchants are <strong>upgrading</strong> to the Skio tech." Note the framing: <em>upgrading</em>, not switching.</div>
      <h2>The 10-step demo flow:</h2>
      <ol>
        <li>Set the Stage</li>
        <li>PDP — Subscription Widget + Conversion Tools</li>
        <li>Volume Discounts, Build-a-Box &amp; Bundles</li>
        <li>Customer Portal</li>
        <li>Surprise &amp; Delight + Streaks</li>
        <li>Cancel Flow</li>
        <li>Journeys</li>
        <li>Segmentation</li>
        <li>Loyalty</li>
        <li>Analytics &amp; Reporting</li>
      </ol>
`},
    { id:'s3p2', title:'Steps 1–2: Stage + PDP', content:`
      <h2>1. Set the Stage</h2>
      <p>Pull up a live customer website and lead with it immediately — don't wait for them to notice the Skio branding. Open with the approved talk track (same one from Section 1). A natural way top reps set it up: <em>"You'll probably see Skio everywhere today — that's on purpose."</em></p>
      <p>Set the deliverable early: <em>"We also build a custom demo environment for every brand we work with. I'll walk you through it today and send it over as a resource for you and your team to review — the goal is to see what this looks like with your products, your branding, and your store."</em></p>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>2. PDP — Subscription Widget + Conversion Tools</h2>
      <p>Don't over-index here — this is not a key differentiator in the space. The same talk tracks you used at Recharge apply. Hit it and keep moving:</p>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"The front end starts exactly like any Shopify store — someone finds a product, adds to cart, checks out. But here's where it gets interesting: most brands are stitching together three or four different apps to influence that journey — one for cart upsells, another for checkout cross-sells, another for subscription conversion. Recharge consolidates all of that into one platform.<br><br>Right in the cart, we can prompt a one-time buyer to switch to a subscription and save, and surface a complementary product at the same time. On Shopify Plus, we extend that into checkout itself: subscription upgrade, cross-sell, even a frequency swap.<br><br>This is the new kingpin strategy for our fastest-scaling merchants — it lets you collect 3–4 months of cash upfront. Once you have that advance on cashflow, you can scale fast and accelerate growth. They're not waiting until post-purchase to optimize, they're shaping subscriber behavior at the exact moment someone commits. Grüns does this very well in their portal too."</div>
      <p><strong>Second-bite play (top reps use this):</strong> if the buyer doesn't take the bigger commitment on the PDP, catch them in the portal after order 1 with an "upgrade to quarterly" banner.</p>
      <p><strong>Front-end stores to demo:</strong>
        <a href="https://dosedaily.co/products/dose-for-your-liver-new" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Dose Daily</a> ·
        <a href="https://transparentlabs.com/products/whey-protein-isolate" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Transparent Labs</a> ·
        <a href="https://gruns.co/products/gruns" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Grüns (custom widget)</a> ·
        <a href="https://im8health.com/products/essentials-pro" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">IM8 (quantity upsell)</a> ·
        <a href="https://neurogum.com/products/energy-focus-extra-strength-gum" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Neuro Gum</a> ·
        <a href="https://instanthydration.com/products/premium-electrolyte-drink-mix" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Instant Hydration</a>
      </p>
`},
    { id:'s3p3', title:'Steps 3–4: Bundles + Portal', content:`
      <h2>3. Volume Discounts, Build-a-Box &amp; Bundles</h2>
      <p>Lead with this for any consumable / CPG catalog — it's a top-tier differentiator. Skio is the only platform in the space that has made volume discounts work: buy-more-save-more logic where the discount scales up as a subscriber adds products and scales back down if they remove them.</p>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"We're the only company in the space that's brought volume discounts to life. As a subscriber adds more products, the discount grows — and if they downgrade their stack, it scales back with them. It's the natural way to grow AOV: people don't buy everything at once, but on order 3 or 4 you dynamically nudge them to add more and save more."</div>
      <p><strong>Proof to name-drop:</strong> Aloha came to Skio for this after 3 different agencies and 3 different builds elsewhere couldn't pull it off; Mozy moved for the same reason.</p>
      <p><strong>Build-a-Box / bundles:</strong>
        <a href="https://justingredients.com/pages/protein-bundle-builder" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Just Ingredients</a> ·
        <a href="https://shop.bulletproof.com/collections/build-your-own-bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Bulletproof Coffee</a> ·
        <a href="https://aloha.com/pages/build-your-own-bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Aloha</a> ·
        <a href="https://www.weheartnutrition.com/pages/bundle" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">WeHeartNutrition</a>
      </p>
      <hr style="border:none;border-top:1px solid var(--border);margin:28px 0;">
      <h2>4. Customer Portal</h2>
      <p>This is where you spend real time. Walk through live: editing frequency, pushing the next order date, swapping products, adding a one-time item.</p>
      <div class="talk-track"><div class="talk-track-label">🎤 Talk track</div>"The goal is to give customers four different ways to take the same action. The number one reason someone calls your support team is because they can't figure out how to skip or delay an order. We make that impossible to miss."</div>
      <p><strong>Differentiators reps consistently win with:</strong></p>
      <ul>
        <li><strong>Passwordless login / magic link.</strong> Skio auto-creates an account on the first order; customers get a 4-digit code + magic link, no password resets.</li>
        <li><strong>Smart upsell carousel.</strong> Recommends products based on what they're already subscribed to — won't show them what they already have. Medterra grew AOV $6 within 2–3 weeks of turning it on.</li>
        <li><strong>Backup payment method.</strong> Customers store a backup card that auto-retries on failure — a direct answer to involuntary/dunning churn.</li>
        <li><strong>"Get it now."</strong> Place the next order immediately — one of the only platforms that offers it.</li>
        <li><strong>Skip at the individual-product level</strong> — skip one item in a multi-product subscription without skipping or churning the whole order.</li>
      </ul>
      <p>Then flip to the backend and show the modular portal builder — drag and drop, no code, built like Shopify's own theme editor.</p>
      <div class="callout callout-warn"><div class="callout-title">⚠️ Live accounts — look, don't touch</div>Graymatter Labs, IM8, and Grüns are live accounts. Show the functionality only — do NOT change, swap, or cancel anything.</div>
`},
    { id:'s3p4', title:'Steps 5–7: Journeys + Cancel', content:`
      <h2>5. Journeys</h2>
      <div class="callout callout-accent"><div class="callout-title">🎥 See it in action</div><a href="https://app.avoma.com/meetings/13b6ff77-a28a-411c-8d91-e52cc2c158fd/transcript/?t=648.33496" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">▶ Watch Noah pitch Journeys live on a demo here</a> <span style="font-weight:400;color:var(--muted);">(starts at 10:48 if it doesn't jump there automatically)</span></div>
      <p>A money moment — build one live on the call. The key is to uncover what part of their current subscription program a Journey can simplify. <strong>This is where pattern recognition wins deals.</strong> The rep who can hear a merchant describe their program and immediately say "that's a Journey" — and then build it in two minutes — closes. The rep who fumbles in the builder loses the moment entirely.</p>
      <div class="callout callout-warn"><div class="callout-title">🛠️ Build these in your demo store first</div>Don't wait until your capstone to get comfortable in the Journey builder. Go build all four use cases below in your demo store today. The goal isn't just to know what Journeys does — it's to know exactly which nodes to reach for when a merchant describes their problem. That's the pattern recognition that makes the live build feel effortless.</div>
      <h3>Common patterns — know these cold:</h3>
      <div style="display:grid;gap:10px;margin:16px 0;">
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🔄 Trial-to-full-size conversion</div>
          <div style="font-size:13px;color:var(--muted);">After the first or second cycle, automatically swap the trial SKU for the full-size product and update the price. Perfect for supplements — the welcome kit becomes a refill program without the merchant lifting a finger. <strong>Actions used: Swap Product + Update product price.</strong></div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">💸 High discount order 1 → lower discount order 2</div>
          <div style="font-size:13px;color:var(--muted);">Give a big welcome discount on the first order to drive conversion, then automatically swap to a sustainable discount on renewal. Protects margin without the merchant having to manually update. <strong>Actions used: Add discount + Remove discounts.</strong></div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">📦 Bundle expansion / kit splitting</div>
          <div style="font-size:13px;color:var(--muted);">Some merchants sell a bundle as a single Shopify line item, which locks subscribers into a rigid recurring order. This Journey breaks the bundled SKU into individual products after a set cycle, giving subscribers the flexibility to swap or remove items. <strong>Actions used: Bundle expansion.</strong></div>
        </div>
        <div style="background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">🏷️ In-portal engagement banners</div>
          <div style="font-size:13px;color:var(--muted);">Trigger an interactive banner inside the customer portal after specific subscriber behavior — offer an upsell, surface a last-minute discount before renewal, or guide them through an "upsize" flow. This is the same mechanic Noah demos for quantity upsell banners. <strong>Actions used: Trigger banner.</strong></div>
        </div>
      </div>
      <h3>All available Journey actions (your toolkit):</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Know what each one does so you can map merchant problems to solutions on the fly:</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Swap Product</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Add Discount</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Add Product</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Change Delivery Price</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Change Interval</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Trigger Banner</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Update Product Price</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Adjust Next Billing Date</span>
        <span style="background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;">Notification (email / SMS / integration)</span>

      <h2>6. Surprise &amp; Delight + Streaks</h2>
